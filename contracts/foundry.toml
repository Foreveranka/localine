[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc = "0.8.35"
evm_version = "osaka"
network = "monad"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
use_literal_content = true

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
